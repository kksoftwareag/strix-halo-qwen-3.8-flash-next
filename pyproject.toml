[project]
name = "qwen38-flash"
version = "0.1.0"
description = "Terminal-UI zum Konfigurieren, Starten und Benchmarken von Qwen3.8-Flash-Next (llama.cpp) auf AMD Strix Halo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.0",
    "httpx>=0.27",
]

[project.scripts]
qwen38 = "qwen38tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen38tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
